packages:
  - 'frontend'
  - 'backend'

overrides:
  # firebase-functions pulls in @types/express@4 transitively, which conflicts
  # with our own @types/express@^5 (backend uses Express 5) and causes
  # environment-dependent type errors depending on how pnpm hoists the two
  # versions. Force one version everywhere.
  '@types/express': '^5.0.1'
  # next@16.2.12 still bundles its own old postcss internally (separate from
  # the patched one Tailwind/Vite already use) — force it to a patched
  # version too. postcss 8.x is backward-compatible within the major.
  postcss: '^8.5.18'
  # next also bundles an old sharp (image optimization) — force the patched line.
  sharp: '^0.35.0'
  # eslint pulls js-yaml through @eslint/eslintrc. Versions >=4.0.0 <4.3.1 are
  # vulnerable to quadratic CPU consumption resolving !!omap (CVE-2026-59870,
  # GHSA-5p4m-2wfm-xmqj). Dev-only dependency, but it fails the CI audit gate.
  # Scoped to the vulnerable range and held inside 4.x — eslintrc targets that
  # major, so js-yaml 5 is not a safe substitute.
  'js-yaml@>=4.0.0 <4.3.1': '^4.3.1'

allowBuilds:
  '@firebase/util': true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
